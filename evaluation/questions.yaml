- id: Q37
  question: "Selon la CNIL, combien de temps peut-on conserver les images d'une caméra de vidéosurveillance sur un lieu de travail ?"
  type: tableau
  reponse_attendue: >-
    Un mois à compter de la captation des images (en règle générale, quelques jours
    suffisent pour les vérifications après un incident). Si une procédure disciplinaire ou
    pénale est engagée, les images sont extraites et conservées pour la durée de la
    procédure.
  sources:
    - document: durees_conservation_rh
      pages: [7]
  citation: "1 moisà compter de la captation des images"
